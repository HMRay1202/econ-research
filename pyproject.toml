[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "econ-research"
version = "0.1.0"
description = "Local-first economics paper research knowledge system"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "docling>=2.0,<3",
  "fastapi>=0.115,<1",
  "openai>=1.50,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
research = "econ_research.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
econ_research = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

